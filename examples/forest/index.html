<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCENA × GAMA — a living forest</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
      #hud {
        position: fixed; top: 12px; left: 12px; color: #eef2f7;
        font: 14px/1.5 system-ui, sans-serif; user-select: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <strong>SCENA × GAMA</strong><br />
      Terrain, sky, forest and a hamlet — all seeded &amp; procedural (SCENA).
      At dusk every window and street lamp ignites together.<br />
      Wardens patrol the road, dodging trees and buildings via prop obstacle
      metadata; birds flock overhead (GAMA). Append <code>?t=0.85</code> to
      freeze the time of day.
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
