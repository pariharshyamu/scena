    <title>SCENA — vehicles</title>

      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
      #hud { position: fixed; top: 12px; left: 12px; color: #eef2f7;

  <body>
    <div id="hud">
      <strong>SCENA — vehicles</strong><br />
      <code>createCar</code>, <code>createBike</code>, <code>createTractor</code>
      and <code>createTruck</code> — kinematic running gear
      (<code>update(dt, { speed, steer })</code> spins wheels radius-correctly,
      steers the fronts, leans the bike) and GRIPS-conformant driver slots an
      ANIMA character drops into. The car and bike lap the court.
    </div>
